<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">LabelTrace — every edit has a source, every release has proof</title>
  <desc id="desc">A colorful medical-device label change workflow connects source evidence, affected variants, validated artwork, human approval, and controlled release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071727"/><stop offset=".56" stop-color="#102c43"/><stop offset="1" stop-color="#15204a"/></linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ef1d1"/><stop offset="1" stop-color="#31b8dc"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8a1ff"/><stop offset="1" stop-color="#7163ff"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbc8e"/><stop offset="1" stop-color="#ff6f78"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb84d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#33d8c1" stop-opacity=".2"/><stop offset="1" stop-color="#33d8c1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9ddf3" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#020914" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="470" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="470" rx="30" fill="url(#grid)"/>
  <circle cx="1290" cy="130" r="350" fill="url(#glow)"/>
  <circle cx="1370" cy="420" r="270" fill="url(#glow)" opacity=".7"/>
  <path d="M0 390C240 300 310 500 540 385S860 240 1080 340s320 40 520-85" fill="none" stroke="#77e8dd" stroke-opacity=".12" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(84 82)">
      <rect width="44" height="44" rx="14" fill="url(#aqua)"/>
      <path d="M13 31V17a4 4 0 0 1 4-4h10M17 17l8 8 10-11M17 17v14" fill="none" stroke="#082538" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="17" cy="31" r="3" fill="#082538"/><circle cx="35" cy="14" r="3" fill="#082538"/>
      <text x="59" y="30" fill="#e9f6ff" font-size="24" font-weight="750" letter-spacing=".2">LABELTRACE</text>
      <rect x="264" y="8" width="124" height="27" rx="13.5" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="280" cy="21.5" r="4" fill="#6ef1d1"/><text x="291" y="26" fill="#c7d9eb" font-size="12" font-weight="650" letter-spacing="1.2">CONTROLLED CHANGE</text>
    </g>
    <text x="84" y="206" fill="#f5f9ff" font-size="51" font-weight="720" letter-spacing="-1.6">Every edit has a source.</text>
    <text x="84" y="269" fill="#f5f9ff" font-size="51" font-weight="720" letter-spacing="-1.6">Every release has proof.</text>
    <text x="88" y="322" fill="#b8cadc" font-size="20">Trace product changes to the right label variants, evidence,</text>
    <text x="88" y="352" fill="#b8cadc" font-size="20">human approval, and the exact released artwork.</text>
    <g transform="translate(88 397)" font-size="14" font-weight="650">
      <rect width="130" height="34" rx="17" fill="#30c9b0" fill-opacity=".15" stroke="#54e5cd" stroke-opacity=".35"/><circle cx="18" cy="17" r="4" fill="#6ef1d1"/><text x="31" y="22" fill="#c9fff3">SOURCE-LED</text>
      <rect x="143" width="149" height="34" rx="17" fill="#8d76ff" fill-opacity=".16" stroke="#b8a1ff" stroke-opacity=".4"/><circle cx="161" cy="17" r="4" fill="#b8a1ff"/><text x="174" y="22" fill="#e5deff">HUMAN-APPROVED</text>
      <rect x="305" width="116" height="34" rx="17" fill="#ff9a79" fill-opacity=".14" stroke="#ffad8d" stroke-opacity=".38"/><circle cx="323" cy="17" r="4" fill="#ffbc8e"/><text x="336" y="22" fill="#ffe2d1">EVIDENCE-BOUND</text>
    </g>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="735" y="88" width="790" height="300" rx="26" fill="#0d2235" fill-opacity=".9" stroke="#cae4f5" stroke-opacity=".17"/>
    <text x="778" y="128" fill="#aac1d5" font-size="12" font-weight="700" letter-spacing="2">ONE CHANGE · EXPLAINABLE PATH · CONTROLLED RELEASE</text>
    <path d="M862 232H1008M1080 232H1226M1298 232H1391" stroke="#6b8ba5" stroke-opacity=".7" stroke-width="3"/>
    <path d="M992 224l13 8-13 8M1209 224l13 8-13 8M1374 224l13 8-13 8" fill="none" stroke="#a8c3d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(780 166)">
      <rect width="92" height="118" rx="16" fill="#16344a" stroke="#6ef1d1" stroke-opacity=".5"/>
      <rect x="31" y="17" width="30" height="36" rx="7" fill="url(#aqua)"/>
      <path d="M38 29h16M38 36h13M38 43h9" stroke="#0d3242" stroke-width="2.5" stroke-linecap="round"/>
      <text x="46" y="77" fill="#e4f4fb" font-size="12" text-anchor="middle" font-weight="650">Approved</text><text x="46" y="94" fill="#e4f4fb" font-size="12" text-anchor="middle">source fact</text>
    </g>
    <g transform="translate(1008 166)">
      <rect width="92" height="118" rx="16" fill="#16344a" stroke="#b8a1ff" stroke-opacity=".58"/>
      <circle cx="46" cy="34" r="17" fill="url(#violet)"/><path d="M38 34h16M46 26v16" stroke="#1d1748" stroke-width="2.4" stroke-linecap="round"/>
      <text x="46" y="77" fill="#e4f4fb" font-size="12" text-anchor="middle" font-weight="650">Affected +</text><text x="46" y="94" fill="#e4f4fb" font-size="12" text-anchor="middle">excluded labels</text>
    </g>
    <g transform="translate(1226 166)">
      <rect width="92" height="118" rx="16" fill="#16344a" stroke="#ffbc8e" stroke-opacity=".55"/>
      <path d="M29 20h24l12 12v30H29z" fill="url(#coral)"/><path d="M53 20v13h12M36 42h22M36 49h18" fill="none" stroke="#52304a" stroke-width="2.1" stroke-linecap="round"/>
      <text x="46" y="77" fill="#e4f4fb" font-size="12" text-anchor="middle" font-weight="650">Checked, exact</text><text x="46" y="94" fill="#e4f4fb" font-size="12" text-anchor="middle">PDF revision</text>
    </g>
    <g transform="translate(1391 166)">
      <rect width="92" height="118" rx="16" fill="#16344a" stroke="#ffe08a" stroke-opacity=".58"/>
      <circle cx="46" cy="36" r="19" fill="url(#gold)"/><path d="m37 36 6 6 12-14" fill="none" stroke="#423217" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="77" fill="#e4f4fb" font-size="12" text-anchor="middle" font-weight="650">Human approval</text><text x="46" y="94" fill="#e4f4fb" font-size="12" text-anchor="middle">+ release gate</text>
    </g>
    <rect x="780" y="316" width="703" height="43" rx="12" fill="#ff897b" fill-opacity=".1" stroke="#ff897b" stroke-opacity=".3"/>
    <circle cx="803" cy="337.5" r="7" fill="#ff897b"/><path d="M803 333v5M803 341v.2" stroke="#452631" stroke-width="2" stroke-linecap="round"/>
    <text x="822" y="343" fill="#ffd5cc" font-size="14" font-weight="650">Relevant edit after approval? Mark it stale. Revalidate and reapprove before release.</text>
  </g>
</svg>
