name: Azure source deployment (manual, existing resources only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labeltrace-azure-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r backend/requirements-lock.txt
      - run: mkdir -p artifacts/azure && python -m pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: frontend
        env: {VITE_DEMO_CREDENTIALS: 'false'}
      - run: python scripts/package_azure.py
      - uses: actions/upload-artifact@v4
        with:
          name: labeltrace-azure-build
          path: |
            artifacts/azure/appservice-source.zip
            frontend/dist
  deploy:
    needs: verify
    if: vars.AZURE_COST_APPROVED == 'true'
    environment: azure-poc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: labeltrace-azure-build, path: build}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy FastAPI source code with Oryx build
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_SERVICE_NAME" --src-path build/artifacts/azure/appservice-source.zip --type zip --timeout 1800000
      - name: Link same-origin API through Static Web Apps
        shell: bash
        run: |
          set -euo pipefail
          backend_id=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_NAME" --query id -o tsv)
          az staticwebapp backends link -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_STATIC_WEB_APP_NAME" --backend-resource-id "$backend_id" --backend-region "$AZURE_LOCATION"
      - name: Obtain deployment token without committing or printing credentials
        id: swa-token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_STATIC_WEB_APP_NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: build/frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
      - name: Readiness through the public frontend proxy
        shell: bash
        run: |
          set -euo pipefail
          host=$(az staticwebapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_STATIC_WEB_APP_NAME" --query defaultHostname -o tsv)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://$host/api/health/ready"
