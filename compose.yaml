services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: labeltrace
      POSTGRES_USER: labeltrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labeltrace"]
      interval: 5s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://labeltrace:${POSTGRES_PASSWORD}@db:5432/labeltrace
      LABELTRACE_DATA: /app/data
      APP_ENV: demo
      AI_MODE: deterministic
    command: ["sh", "-c", "python manage.py init && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["label-objects:/app/data"]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: node:22.16.0-alpine
    working_dir: /app/frontend
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      API_TARGET: http://api:8000
    volumes: ["./frontend:/app/frontend", "frontend-modules:/app/frontend/node_modules"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  postgres-data:
  label-objects:
  frontend-modules:
