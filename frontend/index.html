<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#123747"/><script>try{const saved=localStorage.getItem('lt-theme-v2');const theme=saved==='light'||saved==='system'?saved:'dark';const resolved=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;document.documentElement.dataset.theme=resolved;document.documentElement.style.colorScheme=resolved}catch{document.documentElement.dataset.theme='dark';document.documentElement.style.colorScheme='dark'}</script><title>LabelTrace | Controlled labeling workspace</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
